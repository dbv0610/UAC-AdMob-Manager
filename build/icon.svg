<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Nền nhiều màu: xanh dương → tím → hồng → cam -->
    <linearGradient id="bg" x1="0.05" y1="0" x2="0.95" y2="1">
      <stop offset="0" stop-color="#2F6BFF"/>
      <stop offset="0.36" stop-color="#7B4DFF"/>
      <stop offset="0.68" stop-color="#F0479A"/>
      <stop offset="1" stop-color="#FF9A2E"/>
    </linearGradient>
    <!-- Vệt sáng xanh ngọc góc trên trái cho chiều sâu -->
    <radialGradient id="glow" cx="0.18" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#3EE6E0" stop-opacity="0.75"/>
      <stop offset="0.45" stop-color="#3EE6E0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warm" cx="0.95" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#FFD25A" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#FFD25A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tri" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7B4DFF"/>
      <stop offset="1" stop-color="#F0479A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1B1240" flood-opacity="0.35"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#2A1060" flood-opacity="0.30"/>
    </filter>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="190"/></clipPath>
  </defs>

  <!-- Khối nền kiểu macOS (lề 100px như icon chuẩn) -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="190" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#sq)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#warm)"/>
    <rect x="100" y="100" width="824" height="420" fill="url(#gloss)"/>
    <!-- Cột biểu đồ mờ phía sau -->
    <g fill="#fff" opacity="0.13">
      <rect x="236" y="640" width="78" height="170" rx="22"/>
      <rect x="350" y="560" width="78" height="250" rx="22"/>
      <rect x="464" y="600" width="78" height="210" rx="22"/>
      <rect x="578" y="470" width="78" height="340" rx="22"/>
    </g>
  </g>

  <!-- Đường tăng trưởng + nút play -->
  <g filter="url(#soft)">
    <polyline points="262,690 430,536 540,608 690,430" fill="none" stroke="#fff" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="262" cy="690" r="50" fill="#fff"/>
    <circle cx="430" cy="536" r="50" fill="#fff"/>
    <circle cx="540" cy="608" r="50" fill="#fff"/>
    <circle cx="712" cy="382" r="128" fill="#fff"/>
  </g>
  <path d="M676 316 L788 382 L676 448 Z" fill="url(#tri)" stroke="url(#tri)" stroke-width="18" stroke-linejoin="round"/>
  <!-- Viền sáng mảnh -->
  <rect x="101.5" y="101.5" width="821" height="821" rx="188.5" fill="none" stroke="#fff" stroke-opacity="0.22" stroke-width="3"/>
</svg>
